<div style="font-family:sans-serif;">

<!-- Header selector -->
<div id="part-selector" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#111c2b;border-bottom:1px solid #1e3050;flex-wrap:wrap;">
  <span style="font-size:12px;color:#7a9cbf;font-weight:500;white-space:nowrap;">Choose body part:</span>
  <div id="btn-group" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
  <button id="clear-btn" onclick="clearSelection()" style="margin-left:auto;font-size:11px;padding:4px 10px;background:transparent;border:0.5px solid #3a5070;color:#7a9cbf;border-radius:4px;cursor:pointer;">Clear</button>
</div>

<!-- 3D viewer -->
<div id="viewer-wrap" style="position:relative;width:100%;height:510px;background:#0d1b2e;overflow:hidden;">
  <canvas id="c" style="width:100%;height:100%;display:block;"></canvas>
  <div id="labels" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
  <div id="info-box" style="display:none;position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#111c2b;border:0.5px solid #2a4060;border-radius:6px;padding:8px 16px;font-size:13px;color:#e2eaf5;text-align:center;pointer-events:none;white-space:nowrap;"></div>
  <div style="position:absolute;top:10px;left:12px;font-size:11px;color:#3a5878;">Drag to rotate · Scroll to zoom</div>
  <div id="loading-msg" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#5a7a9a;">Loading model...</div>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Body regions with normalized y coords relative to model bounding box
// y=1 = top of head, y=0 = bottom of feet (will be mapped after model loads)
const BODY_REGIONS = [
  { name:"Head",           ny:0.95, nx: 0.00, color:"#378ADD", desc:"Head & face region" },
  { name:"Neck",           ny:0.85, nx: 0.00, color:"#4caf7d", desc:"Neck & cervical area" },
  { name:"Left shoulder",  ny:0.76, nx:-0.22, color:"#D85A30", desc:"Left shoulder joint" },
  { name:"Right shoulder", ny:0.76, nx: 0.22, color:"#D85A30", desc:"Right shoulder joint" },
  { name:"Chest",          ny:0.68, nx: 0.00, color:"#7F77DD", desc:"Thorax / chest" },
  { name:"Left arm",       ny:0.60, nx:-0.30, color:"#1D9E75", desc:"Left upper arm" },
  { name:"Right arm",      ny:0.60, nx: 0.30, color:"#1D9E75", desc:"Right upper arm" },
  { name:"Abdomen",        ny:0.54, nx: 0.00, color:"#BA7517", desc:"Abdominal region" },
  { name:"Left hand",      ny:0.42, nx:-0.34, color:"#D4537E", desc:"Left hand" },
  { name:"Right hand",     ny:0.42, nx: 0.34, color:"#D4537E", desc:"Right hand" },
  { name:"Pelvis",         ny:0.40, nx: 0.00, color:"#378ADD", desc:"Hip / pelvis region" },
  { name:"Left thigh",     ny:0.30, nx:-0.13, color:"#1D9E75", desc:"Left upper leg" },
  { name:"Right thigh",    ny:0.30, nx: 0.13, color:"#1D9E75", desc:"Right upper leg" },
  { name:"Left knee",      ny:0.18, nx:-0.12, color:"#E24B4A", desc:"Left knee joint" },
  { name:"Right knee",     ny:0.18, nx: 0.12, color:"#E24B4A", desc:"Right knee joint" },
  { name:"Left shin",      ny:0.09, nx:-0.11, color:"#BA7517", desc:"Left lower leg" },
  { name:"Right shin",     ny:0.09, nx: 0.11, color:"#BA7517", desc:"Right lower leg" },
  { name:"Left foot",      ny:0.02, nx:-0.12, color:"#7F77DD", desc:"Left foot" },
  { name:"Right foot",     ny:0.02, nx: 0.12, color:"#7F77DD", desc:"Right foot" },
];

let scene, camera, renderer, model, isDragging=false;
let prevMouse={x:0,y:0}, rotX=0, rotY=0;
let labelDivs=[], modelBox=null, modelHeight=1, modelCenterY=0;
let selectedPart=null;
const wrap=document.getElementById("viewer-wrap");
const canvas=document.getElementById("c");
const labelsEl=document.getElementById("labels");
const infoBox=document.getElementById("info-box");

// Build top selector buttons
const btnGroup=document.getElementById("btn-group");
BODY_REGIONS.forEach(r=>{
  const b=document.createElement("button");
  b.textContent=r.name;
  b.dataset.name=r.name;
  b.style.cssText=`font-size:11px;padding:3px 8px;background:transparent;border:0.5px solid ${r.color};color:${r.color};border-radius:4px;cursor:pointer;transition:background 0.15s;`;
  b.onmouseenter=()=>{ if(selectedPart!==r.name) b.style.background=r.color+'22'; };
  b.onmouseleave=()=>{ if(selectedPart!==r.name) b.style.background='transparent'; };
  b.onclick=()=>selectPart(r.name);
  btnGroup.appendChild(b);
});

function selectPart(name){
  selectedPart=name;
  // Update button styles
  btnGroup.querySelectorAll("button").forEach(b=>{
    const r=BODY_REGIONS.find(x=>x.name===b.dataset.name);
    if(b.dataset.name===name){
      b.style.background=r.color+'44';
      b.style.fontWeight='600';
    } else {
      b.style.background='transparent';
      b.style.fontWeight='400';
    }
  });
  // Show info
  const r=BODY_REGIONS.find(x=>x.name===name);
  if(r){ infoBox.textContent=`${r.name}: ${r.desc}`; infoBox.style.display='block'; setTimeout(()=>infoBox.style.display='none',2500); }
  // Highlight label
  labelDivs.forEach(({el,region})=>{
    const dot=el.querySelector(".dot");
    const lbl=el.querySelector(".lbl");
    if(region.name===name){
      dot.style.transform='translate(-50%,-50%) scale(1.5)';
      lbl.style.fontWeight='600';
      lbl.style.borderColor=region.color;
    } else {
      dot.style.transform='translate(-50%,-50%) scale(1)';
      lbl.style.fontWeight='400';
      lbl.style.borderColor='#1e3050';
    }
  });
}

function clearSelection(){
  selectedPart=null;
  btnGroup.querySelectorAll("button").forEach(b=>{
    b.style.background='transparent'; b.style.fontWeight='400';
  });
  labelDivs.forEach(({el,region})=>{
    el.querySelector(".dot").style.transform='translate(-50%,-50%) scale(1)';
    const lbl=el.querySelector(".lbl");
    lbl.style.fontWeight='400'; lbl.style.borderColor='#1e3050';
  });
}

function init(){
  const W=wrap.clientWidth, H=wrap.clientHeight;
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(W,H);
  renderer.setClearColor(0x000000,0);

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(45,W/H,0.01,100);
  camera.position.set(0,0,3.2);

  scene.add(new THREE.AmbientLight(0xffffff,0.7));
  const dir=new THREE.DirectionalLight(0xffffff,0.8);
  dir.position.set(1,2,3); scene.add(dir);

  loadGLB(); createLabels(); animate(); bindEvents();
}

function loadGLB(){
  const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js";
  s.onload=()=>{
    const loader=new THREE.GLTFLoader();
    fetch("/mnt/user-data/uploads/partpacker_20260418_141146.glb")
      .then(r=>r.arrayBuffer())
      .then(buf=>loader.parse(buf,"",gltf=>{
        model=gltf.scene;
        model.traverse(o=>{ if(o.isMesh) o.material=new THREE.MeshPhongMaterial({color:0xc49a78,specular:0x333333,shininess:20}); });
        const box=new THREE.Box3().setFromObject(model);
        const ctr=box.getCenter(new THREE.Vector3());
        const size=box.getSize(new THREE.Vector3());
        model.position.sub(ctr);
        const scale=1.85/size.y;
        model.scale.setScalar(scale);
        scene.add(model);
        // Compute bounding box in world space after centering
        const box2=new THREE.Box3().setFromObject(model);
        modelBox=box2;
        modelHeight=box2.max.y-box2.min.y;
        modelCenterY=(box2.max.y+box2.min.y)/2;
        document.getElementById("loading-msg").style.display="none";
      },()=>fallback()))
      .catch(()=>fallback());
  };
  s.onerror=()=>fallback();
  document.head.appendChild(s);
}

function fallback(){
  const geo=new THREE.CylinderGeometry(0.28,0.28,1.85,16);
  model=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:0xc49a78}));
  scene.add(model);
  modelHeight=1.85; modelCenterY=0;
  modelBox={min:{y:-0.925},max:{y:0.925}};
  document.getElementById("loading-msg").style.display="none";
}

function createLabels(){
  BODY_REGIONS.forEach((r,i)=>{
    const d=document.createElement("div");
    d.style.cssText="position:absolute;pointer-events:auto;cursor:pointer;width:0;height:0;";
    const dot=document.createElement("div");
    dot.className="dot";
    dot.style.cssText=`position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;background:${r.color};border:1.5px solid #fff;transform:translate(-50%,-50%);box-sizing:border-box;transition:transform 0.15s;`;
    const lbl=document.createElement("span");
    lbl.className="lbl";
    lbl.textContent=r.name;
    const side=r.nx<=0?"right:12px;":"left:12px;";
    lbl.style.cssText=`position:absolute;top:0;${side}transform:translateY(-50%);font-size:11px;font-weight:400;color:#e2eaf5;background:#0d1b2e;padding:2px 7px;border-radius:4px;border:0.5px solid #1e3050;white-space:nowrap;transition:border-color 0.15s,font-weight 0.15s;`;
    d.appendChild(dot); d.appendChild(lbl);
    d.addEventListener("click",()=>selectPart(r.name));
    labelsEl.appendChild(d);
    labelDivs.push({el:d,region:r});
  });
}

function updateLabels(){
  if(!modelBox) return;
  const W=wrap.clientWidth, H=wrap.clientHeight;
  labelDivs.forEach(({el,region})=>{
    // Map ny (0=feet, 1=head) to world y
    const worldY=modelBox.min.y + region.ny*modelHeight;
    // Map nx to world x (scale by half model width ~0.55)
    const worldX=region.nx*0.55;
    const v=new THREE.Vector3(worldX,worldY,0.12);
    // Apply current rotation
    v.applyEuler(new THREE.Euler(rotX,rotY,0,"YXZ"));
    v.project(camera);
    const px=(v.x*0.5+0.5)*W;
    const py=(-v.y*0.5+0.5)*H;
    el.style.left=px+"px";
    el.style.top=py+"px";
    el.style.display=(v.z<1)?"block":"none";
  });
}

function animate(){
  requestAnimationFrame(animate);
  if(model){ model.rotation.y=rotY; model.rotation.x=rotX; }
  renderer.render(scene,camera);
  updateLabels();
}

function bindEvents(){
  canvas.addEventListener("mousedown",e=>{isDragging=true;prevMouse={x:e.clientX,y:e.clientY};});
  window.addEventListener("mouseup",()=>isDragging=false);
  window.addEventListener("mousemove",e=>{
    if(!isDragging)return;
    rotY+=(e.clientX-prevMouse.x)*0.01;
    rotX+=(e.clientY-prevMouse.y)*0.01;
    rotX=Math.max(-Math.PI/2,Math.min(Math.PI/2,rotX));
    prevMouse={x:e.clientX,y:e.clientY};
  });
  canvas.addEventListener("wheel",e=>{
    camera.position.z=Math.max(1.2,Math.min(6,camera.position.z+e.deltaY*0.005));
    e.preventDefault();
  },{passive:false});
  canvas.addEventListener("touchstart",e=>{isDragging=true;prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};});
  canvas.addEventListener("touchend",()=>isDragging=false);
  canvas.addEventListener("touchmove",e=>{
    if(!isDragging)return;
    rotY+=(e.touches[0].clientX-prevMouse.x)*0.012;
    rotX+=(e.touches[0].clientY-prevMouse.y)*0.012;
    prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};
    e.preventDefault();
  },{passive:false});
  window.addEventListener("resize",()=>{
    const W=wrap.clientWidth,H=wrap.clientHeight;
    camera.aspect=W/H; camera.updateProjectionMatrix();
    renderer.setSize(W,H);
  });
}

init();
</script>
